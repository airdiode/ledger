<main class="card">
  <p class="when">1931 年 6 月 · 青岛 · 银元</p>

  <h1>一块钱</h1>

  <ul class="equals" id="equals"></ul>

  <p class="note">
    数字来自当年 6 月的批发物价表，按「一元」折算。同一份表里还有一百多种商品，
    这五样是当时普通人家过日子的开销。
  </p>

  <p class="caveat">
    十四年后，同样一块钱在北平只能买 <b>1.4 斤米</b>。但那已经是另一种钱了——
    1943 年是法币与联银券，不是银元。<b>两个数字不能直接比。</b>
  </p>

<script>
(function () {
  'use strict';
  var B = window.LEDGER_BASKET;
  if (!B) return;
  var s = B.snapshots.filter(function (x) { return x.id === 'qd1931'; })[0];
  if (!s) return;

  function fmt(v) { return v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2); }
  var host = document.getElementById('equals');
  host.innerHTML = s.staples.filter(function (it) { return it.cat !== '杂粮'; }).map(function (it) {
    return '<li><span class="q">= <b>' + fmt(it.o) + '</b> 斤</span>' +
           '<span class="n">' + it.n + '</span></li>';
  }).join('');
})();
</script>
